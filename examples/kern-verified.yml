name: kern-verified
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
permissions:
  contents: write
  checks: write
  pull-requests: write
concurrency:
  group: kern-verified-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: false
jobs:
  kern-verified:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: (startsWith(github.event.pull_request.head.ref, 'kern/') || startsWith(github.event.pull_request.head.ref, 'renovate/') || startsWith(github.event.pull_request.head.ref, 'dependabot/')) && github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: jastijayakrishna/Kerner@FULL_COMMIT_SHA
        with:
          comment: "true"
          agent-mention: ""
          max-attempts: "3"
          verifier-url: ${{ vars.KERN_VERIFIER_URL }}
          verifier-token: ${{ secrets.KERN_VERIFIER_TOKEN }}

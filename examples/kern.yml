name: Kern

on:
  pull_request:
  push:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
  statuses: write
  id-token: write

jobs:
  kern:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/kern'))
    uses: jastijayakrishna/Kerner/.github/workflows/kern.yml@one
    secrets: inherit

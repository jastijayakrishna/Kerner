[package]
name = "kern"
version = "0.3.0"
edition = "2024"
publish = false
description = "Admission control for AI-written code: exact-commit verification, capability diffs and signed in-toto attestations"

[dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
getrandom = "0.4.3"
hex = "0.4.3"
libc = "0.2.190"
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_ast_visit = "0.152.0"
oxc_parser = "0.152.0"
oxc_semantic = "0.152.0"
oxc_span = "0.152.0"
oxc_syntax = "0.152.0"
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
ureq = "3.4.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "kern"
version = "0.3.0"
edition = "2024"
publish = false
description = "One receipt on every pull request: the project's own tests on the old and the new code, static rules, a type check and planted faults"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
hex = "0.4.3"
libc = "0.2.190"
num-bigint = "0.5.1"
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_ast_visit = "0.152.0"
oxc_parser = "0.152.0"
oxc_semantic = "0.152.0"
oxc_span = "0.152.0"
oxc_syntax = "0.152.0"
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
ureq = "3.4.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
protobuf = "3.7.2"
scip = "0.10.0"

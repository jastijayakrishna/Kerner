name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, asset: kern-linux-x64 }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, asset: kern-windows-x64.exe }
          - { os: macos-15, target: aarch64-apple-darwin, asset: kern-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == *musl ]]; then sudo apt-get update && sudo apt-get install -y musl-tools; fi
          rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - name: Test
        shell: bash
        run: cargo test --locked
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          cargo build --locked --release --target "$TARGET"
          mkdir dist
          cp "target/$TARGET/release/kern$([[ "$TARGET" == *windows* ]] && echo .exe)" "dist/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum kern-* | tee SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/kern-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Kern $TAG" \
            --notes "Pin the action to these binaries with scripts/pin-release.sh $TAG. Check provenance with: gh attestation verify <file> --repo $GITHUB_REPOSITORY"

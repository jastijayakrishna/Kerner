name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, asset: kern-linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: kern-linux-arm64 }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, asset: kern-windows-x64.exe }
          - { os: macos-15, target: aarch64-apple-darwin, asset: kern-macos-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, asset: kern-macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == *musl ]]; then sudo apt-get update && sudo apt-get install -y musl-tools; fi
          rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - name: Test
        shell: bash
        run: cargo test --locked
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          if [[ "$TARGET" == *musl ]]; then export "CC_${TARGET//-/_}=musl-gcc"; fi
          cargo build --locked --release --target "$TARGET"
          mkdir dist
          cp "target/$TARGET/release/kern$([[ "$TARGET" == *windows* ]] && echo .exe)" "dist/$ASSET"
          if [[ "$TARGET" == *musl ]]; then file "dist/$ASSET" | tee /dev/stderr | grep -qE 'static(ally|-pie) linked'; fi
          "dist/$ASSET" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Installers
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ && "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::Unexpected tag or repository name"; exit 1; }
          for f in install.sh install.ps1; do
            sed -e "s|__KERN_REPO__|$GITHUB_REPOSITORY|g" -e "s|__KERN_VERSION__|$TAG|g" "scripts/$f" > "dist/$f"
            if grep -q '__KERN_' "dist/$f"; then echo "::error::$f was not stamped"; exit 1; fi
          done
      - name: Checksums
        run: cd dist && sha256sum kern-* install.sh install.ps1 | tee SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/kern-*
            dist/install.sh
            dist/install.ps1
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Kern $TAG" --notes "Install on Linux or macOS: \`curl -fsSL $url/install.sh | sh\`
          Install on Windows (PowerShell): \`irm $url/install.ps1 | iex\`

          Every file is listed in SHA256SUMS and has a GitHub build-provenance attestation: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."

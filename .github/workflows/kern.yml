name: Kern

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        description: Optional. Turns on the AI investigation, which runs in a job of its own that never runs the pull request's code; the job that runs it still holds no keys
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Not used by this version
        required: false

permissions: {}

jobs:
  plan:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      statuses: write
      id-token: write
    outputs:
      kern: ${{ steps.which.outputs.sha }}
      ai: ${{ steps.ai.outputs.on }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Whether the AI step can run
        id: ai
        env:
          KEYED: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: echo "on=$KEYED" >> "$GITHUB_OUTPUT"

      - name: Mark the pull request as being checked
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -d '{"state":"pending","context":"Kern","description":"Checking what this change does when it runs"}' > /dev/null || true

      - name: Which Kern
        id: which
        run: |
          set -euo pipefail
          sha=""; ref=""
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kern-version" | jq -r .value)
            claims=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0) % 4) $0 = $0 "="; print }' | base64 -d)
            sha=$(printf '%s' "$claims" | jq -r '.job_workflow_sha // empty')
            ref=$(printf '%s' "$claims" | jq -r '.job_workflow_ref // empty')
          fi
          echo "sha=${sha:-main}" >> "$GITHUB_OUTPUT"
          echo "Kern at ${ref:-main} (${sha:-main})"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Check out Kern
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jastijayakrishna/Kerner
          ref: ${{ needs.plan.outputs.kern }}
          path: .kern
          persist-credentials: false

      - name: Build Kern from source, with no cache, on a machine where no pull request code runs
        id: build
        working-directory: .kern
        run: |
          set -euo pipefail
          target="$(uname -m)-unknown-linux-musl"
          command -v musl-gcc > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools > /dev/null; }
          rustup target add "$target" > /dev/null
          export "CC_${target//-/_}=musl-gcc"
          cargo build --release --locked --quiet --target "$target"
          mkdir -p "$RUNNER_TEMP/trusted" && cp "target/$target/release/kern" "$RUNNER_TEMP/trusted/kern"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/trusted/kern" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Keep it for the job that signs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kern-trusted-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted/kern
          if-no-files-found: error
          retention-days: 1

  investigate:
    name: Kern investigates
    needs: [plan, build]
    if: github.event_name == 'pull_request' && needs.plan.outputs.ai == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Kern, built where no pull request code ran
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kern-trusted-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted

      - name: Check it is the Kern the build job made
        env:
          WANT: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/trusted/kern"
          [ "$(sha256sum "$K" | cut -d' ' -f1)" = "$WANT" ] || { echo "::error::The Kern binary is not the one the build job made"; exit 1; }
          chmod +x "$K"

      - name: Check out the pull request, to read and never to run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: repo
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: The commit it branched from
        id: base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" | jq -r '.merge_base_commit.sha // empty') || base=""
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::warning::Kern could not find the commit this change branched from, so it does not investigate"; exit 0; }
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C repo -c "http.$GITHUB_SERVER_URL/.extraheader=$auth" fetch --quiet --no-tags --depth=1 origin "$base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: The AI's answers for this exact change, if Kern asked before
        id: asked
        if: steps.base.outputs.sha != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/investigation
          key: kern-investigation-v1-${{ needs.plan.outputs.kern }}-${{ steps.base.outputs.sha }}-${{ github.event.pull_request.head.sha }}

      - name: Investigate, reading the code and never running it
        id: investigate
        if: steps.base.outputs.sha != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/investigation" && mkdir -p "$O"
          jq -r '"# " + .pull_request.title + "\n\n" + (.pull_request.body // "")' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr.md"
          "$RUNNER_TEMP/trusted/kern" investigate "$GITHUB_WORKSPACE/repo" "$BASE" "$HEAD_SHA" "$RUNNER_TEMP/pr.md" "$O" | tee "$RUNNER_TEMP/investigate.json"
          if [ -f "$O/oracle.answer.json" ] && [ -f "$O/hunter.answer.json" ]; then echo "answered=true" >> "$GITHUB_OUTPUT"; fi

      - name: Keep the AI's answers, so a rerun of this change asks nothing new
        if: steps.asked.outputs.cache-hit != 'true' && steps.investigate.outputs.answered == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/investigation
          key: kern-investigation-v1-${{ needs.plan.outputs.kern }}-${{ steps.base.outputs.sha }}-${{ github.event.pull_request.head.sha }}

      - name: Hand the investigation to the job that runs the tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kern-investigation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/investigation/investigation.json
          if-no-files-found: ignore
          retention-days: 1

  run:
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    concurrency:
      group: kern-run-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: repo
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: The commit it branched from
        id: base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          fetch() { git -C repo -c "http.$GITHUB_SERVER_URL/.extraheader=$auth" fetch --quiet --no-tags "$@"; }
          base=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" | jq -r '.merge_base_commit.sha // empty') || base=""
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && fetch --depth=1 origin "$base"; then
            echo "Kern compares $HEAD_SHA with $base, where it branched off"
          else
            fetch --unshallow origin || true
            fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            base=$(git -C repo merge-base "$BASE_SHA" "$HEAD_SHA" 2> /dev/null) || base=$(git -C repo merge-base "origin/$BASE_REF" "$HEAD_SHA")
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Check out Kern
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jastijayakrishna/Kerner
          ref: ${{ needs.plan.outputs.kern }}
          path: .kern
          persist-credentials: false

      - name: Kern's commit
        id: kern
        run: echo "sha=$(git -C .kern rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Kern, built before
        id: built
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.kern-bin
          key: kern-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.kern.outputs.sha }}

      - name: Kern's build cache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .kern/target
          key: kern-${{ runner.os }}-${{ hashFiles('.kern/Cargo.lock', '.kern/src/**') }}
          restore-keys: kern-${{ runner.os }}-

      - name: Build Kern
        id: install
        working-directory: .kern
        env:
          KERN_VERSION: ""
          KERN_SOURCE: ${{ github.workspace }}/.kern
          KERN_STATIC: "true"
          BUILD_FROM_SOURCE: "true"
        run: |
          set -euo pipefail
          b="$HOME/.kern-bin/kern"
          if [ ! -x "$b" ]; then
            o=$(mktemp)
            GITHUB_OUTPUT="$o" GITHUB_ENV="$o" bash scripts/install-kern.sh
            mkdir -p "${b%/*}" && cp "$(sed -n 's/^bin=//p' "$o" | tail -n 1)" "$b"
          fi
          echo "bin=$b" >> "$GITHUB_OUTPUT"

      - name: Sandbox
        uses: ./.kern/.github/actions/sandbox
        with:
          kern: ${{ steps.install.outputs.bin }}

      - name: The plan Kern learned for this base, if its branch was learned
        id: plans
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/plans
          key: kern-plan-v1-${{ needs.plan.outputs.kern }}-${{ github.event.pull_request.base.sha }}

      - name: Check
        env:
          KERN_BIN: ${{ steps.install.outputs.bin }}
          KERN_KEEP: ${{ runner.environment == 'github-hosted' && '1' || '0' }}
          BASE: ${{ steps.base.outputs.sha }}
          KERN_CHECK_AI: "0"
          KERN_PLANS: ${{ steps.plans.outputs.cache-hit == 'true' && format('{0}/plans', runner.temp) || '' }}
          AI: ${{ needs.plan.outputs.ai }}
          GITHUB_TOKEN: ${{ github.token }}
          INVESTIGATION: kern-investigation-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/kern"
          jq -r '"# " + .pull_request.title + "\n\n" + (.pull_request.body // "")' "$GITHUB_EVENT_PATH" > "$W/pr.md"
          fetch() {
            local api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" auth="Authorization: Bearer $GITHUB_TOKEN" state url
            for _ in $(seq 1 90); do
              state=$(curl -fsS -H "$auth" "$api/jobs?per_page=100" | jq -r '[.jobs[] | select(.name | endswith("Kern investigates"))][0].status // empty') || state=""
              url=$(curl -fsS -H "$auth" "$api/artifacts?name=$INVESTIGATION" | jq -r '.artifacts[0].archive_download_url // empty') || url=""
              if [ -n "$url" ] && curl -fsSL -H "$auth" -o "$W/investigation.zip" "$url" && unzip -p "$W/investigation.zip" investigation.json > "$W/investigation.part"; then
                mv "$W/investigation.part" "$KERN_INVESTIGATION"; return 0
              fi
              if [ "$state" = completed ]; then
                printf '{"version":1,"status":"FAILED","why":"the AI step ended without an investigation"}\n' > "$W/investigation.part" && mv "$W/investigation.part" "$KERN_INVESTIGATION"; return 0
              fi
              sleep 10
            done
          }
          if [ "$AI" = true ]; then export KERN_INVESTIGATION="$W/investigation.json"; fetch & fi
          "$KERN_BIN" --control "$W/verifier.json" check "$GITHUB_WORKSPACE/repo" "$BASE" "$HEAD_SHA" "$W/out" "$W/operator.json" "$W/pr.md" | tee "$W/check.json"
          kill %1 2> /dev/null || true
          cat "$W/out/receipt.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the results to the job that signs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kern-run-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kern/out/receipt.json
            ${{ runner.temp }}/kern/check.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean
        if: always() && runner.environment != 'github-hosted'
        env:
          KERN_BIN: ${{ steps.install.outputs.bin }}
        run: |
          W="$RUNNER_TEMP/kern"
          if { [ -f "$W/out/setup.json" ] || [ -f "$W/out/volumes.txt" ]; } && [ -x "$KERN_BIN" ]; then "$KERN_BIN" --control "$W/verifier.json" drive clean "$W/out" > /dev/null || true; fi

  learn:
    name: Kern learns the setup
    needs: [plan, build]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    continue-on-error: true
    permissions:
      contents: read
    concurrency:
      group: kern-learn-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: Kern, built where no untrusted code ran
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kern-trusted-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted

      - name: Check it is the Kern the build job made
        env:
          WANT: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/trusted/kern"
          [ "$(sha256sum "$K" | cut -d' ' -f1)" = "$WANT" ] || { echo "::error::The Kern binary is not the one the build job made"; exit 1; }
          chmod +x "$K"

      - name: Check out the commit pushed to the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: repo
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Check out Kern, for its sandbox steps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jastijayakrishna/Kerner
          ref: ${{ needs.plan.outputs.kern }}
          path: .kern
          persist-credentials: false

      - name: Sandbox
        uses: ./.kern/.github/actions/sandbox
        with:
          kern: ${{ runner.temp }}/trusted/kern

      - name: The plan learned for the commit before this one, kept when the setup files did not change
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/plans
          key: kern-plan-v1-${{ needs.plan.outputs.kern }}-${{ github.event.before }}
          restore-keys: kern-plan-v1-${{ needs.plan.outputs.kern }}-

      - name: Learn this repository's setup from its CI job, or from the setup engineer when a key is given, by running it twice
        id: learn
        env:
          KERN_BIN: ${{ runner.temp }}/trusted/kern
          KERN_PLANS: ${{ runner.temp }}/plans
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          W="$RUNNER_TEMP/kern"
          "$KERN_BIN" --control "$W/verifier.json" learn "$GITHUB_WORKSPACE/repo" "$GITHUB_SHA" "$W/out" "$W/operator.json" > "$W/learn.json" 2> "$W/learn.err"
          status=$(jq -r '.status // empty' "$W/learn.json" 2> /dev/null) || status=""
          if [ -n "$status" ]; then why=$(jq -r '.why // ""' "$W/learn.json"); else status="FAILED"; why="Kern could not finish: $(jq -r '.reason // empty' "$W/learn.err" 2> /dev/null || tail -c 2000 "$W/learn.err")"; fi
          echo "$status: $why"
          { echo "### Kern learned the setup of $GITHUB_SHA"; echo; echo "- $status: $why"; } >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$KERN_PLANS" && mkdir -p "$KERN_PLANS"
          if cp "$W"/out/plan-*.json "$KERN_PLANS"/ 2> /dev/null; then echo "learned=true" >> "$GITHUB_OUTPUT"; else echo "learned=false" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Keep the plan, so every pull request on this commit is checked through it
        if: steps.learn.outputs.learned == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/plans
          key: kern-plan-v1-${{ needs.plan.outputs.kern }}-${{ github.sha }}

  sign:
    needs: [plan, build, run]
    if: always() && needs.plan.result == 'success' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    concurrency:
      group: kern-sign-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      NUMBER: ${{ github.event.pull_request.number }}
      FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Kern, built where no pull request code ran
        id: trusted
        if: needs.build.result == 'success' && needs.run.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kern-trusted-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted

      - name: The run's results, as data
        id: results
        if: steps.trusted.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kern-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results

      - name: Render the receipt with the trusted Kern
        id: render
        if: steps.results.outcome == 'success'
        env:
          WANT: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/trusted/kern"
          [ "$(sha256sum "$K" | cut -d' ' -f1)" = "$WANT" ] || { echo "::error::The Kern binary is not the one the build job made"; exit 1; }
          chmod +x "$K"
          echo "bin=$K" >> "$GITHUB_OUTPUT"
          O="$RUNNER_TEMP/kern-out" && rm -rf "$O" && mkdir -p "$O"
          R="$RUNNER_TEMP/results"
          src=$(find "$R" -name receipt.json -type f | head -n 1)
          [ -n "$src" ] || { echo "::error::The run gave no receipt"; exit 1; }
          cp "$src" "$O/receipt.json"
          "$K" receipt render "$O" "$HEAD_SHA"
          cat "$O/receipt.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign
        id: sign
        if: steps.render.outcome == 'success'
        env:
          KERN_BIN: ${{ steps.render.outputs.bin }}
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then "$KERN_BIN" receipt sign "$RUNNER_TEMP/kern-out" "$GITHUB_REPOSITORY" "$NUMBER"
          else echo "::notice::No id-token: write permission, so the receipt is not signed and cannot be approved"; fi

      - name: Post
        id: post
        if: steps.render.outcome == 'success'
        env:
          KERN_BIN: ${{ steps.render.outputs.bin }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if "$KERN_BIN" receipt post "$RUNNER_TEMP/kern-out" "$GITHUB_REPOSITORY" "$NUMBER"; then exit 0; fi
          [ "$FORK" = true ] || { echo "::error::Kern could not post its receipt; the receipt is in this job's summary"; exit 1; }
          decision=$(jq -r .decision "$RUNNER_TEMP/kern-out/receipt.json")
          echo "::warning::This pull request comes from a fork, so GitHub gives this job a read-only token: Kern's receipt is in the job summary, not on the pull request"
          [ "$decision" = clear ] || { echo "::error::Kern's decision is $decision; read the receipt in this job's summary"; exit 1; }

      - name: Say so if Kern could not finish
        if: always() && (needs.run.result != 'success' || needs.build.result != 'success' || steps.render.outcome != 'success' || steps.sign.outcome == 'failure' || steps.post.outcome == 'failure')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WHY: ${{ (needs.run.result == 'cancelled' || job.status == 'cancelled') && 'Kern was stopped before it finished; run the job again' || 'Kern could not finish; see the job log' }}
        run: |
          jq -n --arg d "$WHY" --arg u "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{ state: "error", context: "Kern", description: $d, target_url: $u }' \
            | curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -d @- > /dev/null || true
          exit 1

      - name: Keep the receipt
        if: always() && steps.render.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kern-receipt-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kern-out/receipt.json
            ${{ runner.temp }}/kern-out/receipt.md
            ${{ runner.temp }}/kern-out/seal.json
          if-no-files-found: ignore

  approve:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/kern approve')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    steps:
      - name: Which Kern
        id: which
        run: |
          set -euo pipefail
          sha=""
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kern-version" | jq -r .value)
            sha=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0) % 4) $0 = $0 "="; print }' | base64 -d | jq -r '.job_workflow_sha // empty')
          fi
          echo "sha=${sha:-main}" >> "$GITHUB_OUTPUT"
      - name: Check out Kern
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jastijayakrishna/Kerner
          ref: ${{ steps.which.outputs.sha }}
          path: .kern
          persist-credentials: false
      - name: Kern's commit
        id: kern
        run: echo "sha=$(git -C .kern rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Kern, built before
        id: built
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.kern-bin
          key: kern-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.kern.outputs.sha }}
      - name: Kern's build cache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .kern/target
          key: kern-${{ runner.os }}-${{ hashFiles('.kern/Cargo.lock', '.kern/src/**') }}
          restore-keys: kern-${{ runner.os }}-
      - name: Build Kern
        id: install
        working-directory: .kern
        env:
          KERN_VERSION: ""
          KERN_SOURCE: ${{ github.workspace }}/.kern
          KERN_STATIC: "true"
          BUILD_FROM_SOURCE: "true"
        run: |
          set -euo pipefail
          b="$HOME/.kern-bin/kern"
          if [ ! -x "$b" ]; then
            o=$(mktemp)
            GITHUB_OUTPUT="$o" GITHUB_ENV="$o" bash scripts/install-kern.sh
            mkdir -p "${b%/*}" && cp "$(sed -n 's/^bin=//p' "$o" | tail -n 1)" "$b"
          fi
          echo "bin=$b" >> "$GITHUB_OUTPUT"
      - name: Approve
        env:
          KERN_BIN: ${{ steps.install.outputs.bin }}
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.comment.user.login }}
        run: '"$KERN_BIN" receipt approve "$GITHUB_REPOSITORY" "$NUMBER" "$LOGIN"'
      - name: Say so if the approval could not be recorded
        if: failure() || cancelled()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          jq -n --arg b "Kern could not record this approval. The run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{ body: $b }' \
            | curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -d @- > /dev/null || true

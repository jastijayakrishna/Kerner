name: Kern

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        description: Optional. Lets Kern run every changed line on the old and the new code (Claude Code in a locked-down mode writes the driver)
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Optional, in place of ANTHROPIC_API_KEY. A Claude subscription token from `claude setup-token`
        required: false

permissions: {}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      statuses: write
      id-token: write
    outputs:
      kern: ${{ steps.which.outputs.sha }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Mark the pull request as being checked
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -d '{"state":"pending","context":"Kern","description":"Checking what this change does when it runs"}' > /dev/null || true

      - name: Which Kern
        id: which
        run: |
          set -euo pipefail
          sha=""; ref=""
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kern-version" | jq -r .value)
            claims=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0) % 4) $0 = $0 "="; print }' | base64 -d)
            sha=$(printf '%s' "$claims" | jq -r '.job_workflow_sha // empty')
            ref=$(printf '%s' "$claims" | jq -r '.job_workflow_ref // empty')
          fi
          echo "sha=${sha:-main}" >> "$GITHUB_OUTPUT"
          echo "Kern at ${ref:-main} (${sha:-main})"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Check out Kern
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jastijayakrishna/Kerner
          ref: ${{ needs.plan.outputs.kern }}
          path: .kern
          persist-credentials: false

      - name: Build Kern from source, with no cache, on a machine where no pull request code runs
        id: build
        working-directory: .kern
        run: |
          set -euo pipefail
          target="$(uname -m)-unknown-linux-musl"
          command -v musl-gcc > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools > /dev/null; }
          rustup target add "$target" > /dev/null
          export "CC_${target//-/_}=musl-gcc"
          cargo build --release --locked --quiet --target "$target"
          mkdir -p "$RUNNER_TEMP/trusted" && cp "target/$target/release/kern" "$RUNNER_TEMP/trusted/kern"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/trusted/kern" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Keep it for the job that signs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kern-trusted-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted/kern
          if-no-files-found: error
          retention-days: 1

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    concurrency:
      group: kern-run-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      NUMBER: ${{ github.event.pull_request.number }}
      HAS_AI: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: How this machine runs the pull request's code
        id: mode
        run: |
          if [ "$HAS_AI" = true ] || [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            echo "runtime=runsc" >> "$GITHUB_OUTPUT"
            echo "This job holds an AI key or the machine is kept between jobs, so the pull request's code runs in gVisor"
          else
            echo "runtime=runc" >> "$GITHUB_OUTPUT"
            echo "This machine holds no keys and is deleted after the job, so the pull request's code runs in locked containers, the way CI runs it"
          fi

      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: repo
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: The commit it branched from
        id: base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          fetch() { git -C repo -c "http.$GITHUB_SERVER_URL/.extraheader=$auth" fetch --quiet --no-tags "$@"; }
          base=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" | jq -r '.merge_base_commit.sha // empty') || base=""
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && fetch --depth=1 origin "$base"; then
            echo "Kern compares $HEAD_SHA with $base, where it branched off"
          else
            fetch --unshallow origin || true
            fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            base=$(git -C repo merge-base "$BASE_SHA" "$HEAD_SHA" 2> /dev/null) || base=$(git -C repo merge-base "origin/$BASE_REF" "$HEAD_SHA")
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Check out Kern
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jastijayakrishna/Kerner
          ref: ${{ needs.plan.outputs.kern }}
          path: .kern
          persist-credentials: false

      - name: Kern's commit
        id: kern
        run: echo "sha=$(git -C .kern rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Kern, built before
        id: built
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.kern-bin
          key: kern-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.kern.outputs.sha }}

      - name: Kern's build cache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .kern/target
          key: kern-${{ runner.os }}-${{ hashFiles('.kern/Cargo.lock', '.kern/src/**') }}
          restore-keys: kern-${{ runner.os }}-

      - name: Build Kern
        id: install
        working-directory: .kern
        env:
          KERN_VERSION: ""
          KERN_SOURCE: ${{ github.workspace }}/.kern
          KERN_STATIC: "true"
          BUILD_FROM_SOURCE: "true"
        run: |
          set -euo pipefail
          b="$HOME/.kern-bin/kern"
          if [ ! -x "$b" ]; then
            o=$(mktemp)
            GITHUB_OUTPUT="$o" GITHUB_ENV="$o" bash scripts/install-kern.sh
            mkdir -p "${b%/*}" && cp "$(sed -n 's/^bin=//p' "$o" | tail -n 1)" "$b"
          fi
          echo "bin=$b" >> "$GITHUB_OUTPUT"

      - name: gVisor
        if: steps.mode.outputs.runtime == 'runsc'
        run: |
          for tool in docker git jq curl; do command -v "$tool" > /dev/null || { echo "::error::Kern needs $tool on the runner"; exit 1; }; done
          if ! docker info --format '{{json .Runtimes}}' | grep '"runsc"' > /dev/null; then
            command -v apt-get > /dev/null || { echo "::error::Docker has no gVisor runtime (runsc) and this runner is not Ubuntu or Debian: install gVisor for Docker first"; exit 1; }
            curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
              | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq runsc > /dev/null
            sudo runsc install && sudo systemctl restart docker
          fi

      - name: Sandbox
        env:
          KERN_BIN: ${{ steps.install.outputs.bin }}
          RUNTIME: ${{ steps.mode.outputs.runtime }}
        run: |
          set -euo pipefail
          for tool in docker git jq curl; do command -v "$tool" > /dev/null || { echo "::error::Kern needs $tool on the runner"; exit 1; }; done
          W="$RUNNER_TEMP/kern" && rm -rf "$W" && mkdir -p "$W/checks" && cd "$W"
          real() { readlink -f "$(command -v "$1")"; }
          hash() { sha256sum "$1" | cut -d' ' -f1; }
          if [ "$RUNTIME" = runc ]; then
            runtime=$(real runc)
            printf '{"host":"github-actions","deployment":"single-vm","machine":"throwaway","reviewed":"%s"}\n' "$(date -u +%F)" > host-policy.json
          else
            runtime=$(readlink -f "$(docker info --format '{{json .Runtimes.runsc}}' | jq -r .path)")
            printf '{"host":"github-actions","deployment":"single-vm","reviewed":"%s"}\n' "$(date -u +%F)" > host-policy.json
          fi
          jq -n --arg docker "$(real docker)" --arg git "$(real git)" --arg runtime "$runtime" --arg version "$("$runtime" --version)" --arg policy "$W/host-policy.json" \
            --arg dh "$(hash "$(real docker)")" --arg gh "$(hash "$(real git)")" --arg rh "$(hash "$runtime")" --arg ph "$(hash host-policy.json)" --arg name "$RUNTIME" \
            '{ version: 1, role: "verifier", docker: { file: $docker, sha256: $dh, endpoint: "unix:///var/run/docker.sock" }, git: { file: $git, sha256: $gh },
               runtime: { file: $runtime, sha256: $rh, version: $version, arguments: [], name: $name }, host_policy: { file: $policy, sha256: $ph } }' > verifier.json
          "$KERN_BIN" --control verifier.json doctor > doctor.json || { cat doctor.json; exit 1; }
          docker pull -q node:22-bookworm-slim > /dev/null
          printf '{"version":1,"cases":[{"command":["/usr/local/bin/npm","test"],"stdout":null}]}\n' > checks/test-suite.json
          jq -n --arg image "$(docker image inspect --format '{{.Id}}' node:22-bookworm-slim)" --arg builder "$(jq -r .builder.sha256 doctor.json)" \
            --argjson check "$("$KERN_BIN" pin-check test-suite checks/test-suite.json)" --arg repo "$GITHUB_REPOSITORY" \
            '{ version: 3, repository: $repo, deployment: "single-vm", executors: ["external"], image: $image,
               builders: { executor: null, verifier: $builder }, checks: [$check], registry: null, permissions: {} }' > operator.json

      - name: Claude Code
        if: env.HAS_AI == 'true'
        env:
          VERSION: 2.1.292
        run: |
          case "$(uname -m)" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; *) echo "::error::No Claude Code build for $(uname -m)"; exit 1 ;; esac
          d="$RUNNER_TEMP/claude-code" && rm -rf "$d" && mkdir -p "$d" && cd "$d"
          npm pack --silent "@anthropic-ai/claude-code-linux-$arch@$VERSION" > /dev/null
          tar -xzf ./*.tgz && rm -f ./*.tgz && chmod +x package/claude
          echo "$d/package" >> "$GITHUB_PATH"

      - name: Check
        env:
          KERN_BIN: ${{ steps.install.outputs.bin }}
          KERN_KEEP: ${{ runner.environment == 'github-hosted' && '1' || '0' }}
          BASE: ${{ steps.base.outputs.sha }}
          ANTHROPIC_API_KEY: ${{ steps.mode.outputs.runtime == 'runsc' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.mode.outputs.runtime == 'runsc' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/kern"
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          jq -r '"# " + .pull_request.title + "\n\n" + (.pull_request.body // "")' "$GITHUB_EVENT_PATH" > "$W/pr.md"
          "$KERN_BIN" --control "$W/verifier.json" check "$GITHUB_WORKSPACE/repo" "$BASE" "$HEAD_SHA" "$W/out" "$W/operator.json" "$W/pr.md" | tee "$W/check.json"
          cat "$W/out/receipt.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the results to the job that signs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kern-run-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kern/out/receipt.json
            ${{ runner.temp }}/kern/out/comment.md
            ${{ runner.temp }}/kern/check.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean
        if: always() && runner.environment != 'github-hosted'
        env:
          KERN_BIN: ${{ steps.install.outputs.bin }}
        run: |
          W="$RUNNER_TEMP/kern"
          if { [ -f "$W/out/setup.json" ] || [ -f "$W/out/volumes.txt" ]; } && [ -x "$KERN_BIN" ]; then "$KERN_BIN" --control "$W/verifier.json" drive clean "$W/out" > /dev/null || true; fi

  sign:
    needs: [plan, build, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    concurrency:
      group: kern-sign-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      NUMBER: ${{ github.event.pull_request.number }}
      FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      HAS_AI: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Kern, built where no pull request code ran
        id: trusted
        if: needs.build.result == 'success' && needs.run.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kern-trusted-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted

      - name: The run's results, as data
        id: results
        if: steps.trusted.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kern-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results

      - name: Render the receipt with the trusted Kern
        id: render
        if: steps.results.outcome == 'success'
        env:
          WANT: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/trusted/kern"
          [ "$(sha256sum "$K" | cut -d' ' -f1)" = "$WANT" ] || { echo "::error::The Kern binary is not the one the build job made"; exit 1; }
          chmod +x "$K"
          echo "bin=$K" >> "$GITHUB_OUTPUT"
          O="$RUNNER_TEMP/kern-out" && rm -rf "$O" && mkdir -p "$O"
          R="$RUNNER_TEMP/results"
          src=$(find "$R" -name receipt.json -type f | head -n 1)
          [ -n "$src" ] || { echo "::error::The run gave no receipt"; exit 1; }
          cp "$src" "$O/receipt.json"
          if [ "$HAS_AI" = true ] && [ -f "$(dirname "$src")/comment.md" ]; then cp "$(dirname "$src")/comment.md" "$O/comment.md"; fi
          "$K" receipt render "$O" "$HEAD_SHA"
          cat "$O/receipt.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign
        id: sign
        if: steps.render.outcome == 'success'
        env:
          KERN_BIN: ${{ steps.render.outputs.bin }}
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then "$KERN_BIN" receipt sign "$RUNNER_TEMP/kern-out" "$GITHUB_REPOSITORY" "$NUMBER"
          else echo "::notice::No id-token: write permission, so the receipt is not signed and cannot be approved"; fi

      - name: Post
        id: post
        if: steps.render.outcome == 'success'
        env:
          KERN_BIN: ${{ steps.render.outputs.bin }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if "$KERN_BIN" receipt post "$RUNNER_TEMP/kern-out" "$GITHUB_REPOSITORY" "$NUMBER"; then exit 0; fi
          [ "$FORK" = true ] || { echo "::error::Kern could not post its receipt; the receipt is in this job's summary"; exit 1; }
          decision=$(jq -r .decision "$RUNNER_TEMP/kern-out/receipt.json")
          echo "::warning::This pull request comes from a fork, so GitHub gives this job a read-only token: Kern's receipt is in the job summary, not on the pull request"
          [ "$decision" = clear ] || { echo "::error::Kern's decision is $decision; read the receipt in this job's summary"; exit 1; }

      - name: Say so if Kern could not finish
        if: always() && (needs.run.result != 'success' || needs.build.result != 'success' || steps.render.outcome != 'success' || steps.sign.outcome == 'failure' || steps.post.outcome == 'failure')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WHY: ${{ (needs.run.result == 'cancelled' || job.status == 'cancelled') && 'Kern was stopped before it finished; run the job again' || 'Kern could not finish; see the job log' }}
        run: |
          jq -n --arg d "$WHY" --arg u "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{ state: "error", context: "Kern", description: $d, target_url: $u }' \
            | curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -d @- > /dev/null || true
          exit 1

      - name: Keep the receipt
        if: always() && steps.render.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kern-receipt-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kern-out/receipt.json
            ${{ runner.temp }}/kern-out/receipt.md
            ${{ runner.temp }}/kern-out/seal.json
          if-no-files-found: ignore

  approve:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/kern approve')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    steps:
      - name: Which Kern
        id: which
        run: |
          set -euo pipefail
          sha=""
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kern-version" | jq -r .value)
            sha=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0) % 4) $0 = $0 "="; print }' | base64 -d | jq -r '.job_workflow_sha // empty')
          fi
          echo "sha=${sha:-main}" >> "$GITHUB_OUTPUT"
      - name: Check out Kern
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jastijayakrishna/Kerner
          ref: ${{ steps.which.outputs.sha }}
          path: .kern
          persist-credentials: false
      - name: Kern's commit
        id: kern
        run: echo "sha=$(git -C .kern rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Kern, built before
        id: built
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.kern-bin
          key: kern-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.kern.outputs.sha }}
      - name: Kern's build cache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .kern/target
          key: kern-${{ runner.os }}-${{ hashFiles('.kern/Cargo.lock', '.kern/src/**') }}
          restore-keys: kern-${{ runner.os }}-
      - name: Build Kern
        id: install
        working-directory: .kern
        env:
          KERN_VERSION: ""
          KERN_SOURCE: ${{ github.workspace }}/.kern
          KERN_STATIC: "true"
          BUILD_FROM_SOURCE: "true"
        run: |
          set -euo pipefail
          b="$HOME/.kern-bin/kern"
          if [ ! -x "$b" ]; then
            o=$(mktemp)
            GITHUB_OUTPUT="$o" GITHUB_ENV="$o" bash scripts/install-kern.sh
            mkdir -p "${b%/*}" && cp "$(sed -n 's/^bin=//p' "$o" | tail -n 1)" "$b"
          fi
          echo "bin=$b" >> "$GITHUB_OUTPUT"
      - name: Approve
        env:
          KERN_BIN: ${{ steps.install.outputs.bin }}
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.comment.user.login }}
        run: '"$KERN_BIN" receipt approve "$GITHUB_REPOSITORY" "$NUMBER" "$LOGIN"'
      - name: Say so if the approval could not be recorded
        if: failure() || cancelled()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          jq -n --arg b "Kern could not record this approval. The run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{ body: $b }' \
            | curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -d @- > /dev/null || true

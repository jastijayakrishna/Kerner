name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runners have Docker, so the local box tests must run there; Windows runners
          # only offer Windows containers and macOS runners have no engine, so those skip them.
          - os: ubuntu-24.04
            require_container: "1"
          - os: windows-2025
            require_container: "0"
          - os: macos-15
            require_container: "0"
    runs-on: ${{ matrix.os }}
    env:
      KERN_REQUIRE_CONTAINER: ${{ matrix.require_container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
  static-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl && rustup default stable
      - name: Build
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Prove the binary is static
        run: |
          file target/x86_64-unknown-linux-musl/release/kern | tee /dev/stderr | grep -qE 'static(ally|-pie) linked'
          target/x86_64-unknown-linux-musl/release/kern --version
